# The edge: TLS, API and WebSocket proxying, and static files proxied to the
# frontend image (#508). Included by the HTTPS server, and by the HTTP server
# when TLS_MODE=proxy (#256).
#
# Security headers live with the response's owner: the frontend image sets the
# SPA's CSP, HSTS and friends, and helmet sets the API's. The edge adds none, so
# a proxied response carries one set rather than two.
# $fwd_proto is defined in /var/cache/nginx/proxy-trust.conf by entrypoint.sh:
# the scheme a trusted reverse proxy reports, else this connection's own.

# OAuth discovery for the MCP resource must reach the backend, not the SPA.
location = /.well-known/oauth-protected-resource/api/mcp {
    proxy_pass http://backend:3001;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
}

# Stateless MCP uses JSON responses; no WebSocket upgrade or proxy buffering.
location = /api/mcp {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    client_max_body_size 16k;
    proxy_buffering off;
    proxy_read_timeout 60s;
}

# API proxy to backend. 300 s because a change under Change Guard on a slow
# device can take minutes end to end: reading the device, saving a restore
# point, applying, checking and re-reading it (a CRS112 took 90 s, #258).
location /api/ {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;
}

# Backups and restores of large configurations take minutes (Discussion #85),
# longer than the 300 s allowed for the rest of the API.
location /api/backups {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_read_timeout 660s;
    proxy_connect_timeout 10s;
}

# Platform backup of MikroTik Manager itself: a restore uploads the backup
# file (up to 20 GB, streamed straight through rather than buffered), and a
# download of a full backup can take a while.
location /api/platform-backup {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    client_max_body_size 20g;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 10s;
}

location /socket.io/ {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 86400;
}

# The frontend image serves the SPA: deep links, caching and headers are its
# concern, not the edge's. The longer /api and /socket.io prefixes above take
# precedence over this one.
location / {
    proxy_pass http://frontend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_read_timeout 30s;
    proxy_connect_timeout 10s;
}
